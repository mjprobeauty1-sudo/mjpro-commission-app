<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MJPRO 团队提成系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#F5F4EF; --paper-raised:#FFFFFF; --ink:#1A1815; --ink-soft:#6B6357; --line:#DDD7C9;
  --accent:#96702E; --accent-soft:#F1E8D2; --accent-text:#6E5220;
  --success:#3F6B52; --success-soft:#E3EDE1; --warning:#9C7327; --warning-soft:#F1E6CE;
  --critical:#A23B3B; --critical-soft:#F5E1E1; --shadow:rgba(26,24,21,0.10);
  --font-sans:-apple-system,"PingFang SC","Segoe UI","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-num:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15130F; --paper-raised:#1D1A15; --ink:#EDE8DD; --ink-soft:#A69C89; --line:#33302A;
    --accent:#D8B15E; --accent-soft:#2E2717; --accent-text:#E7C77E;
    --success:#6FAE87; --success-soft:#1E2B21; --warning:#D2A25E; --warning-soft:#2E2717;
    --critical:#E27E7E; --critical-soft:#33201F; --shadow:rgba(0,0,0,0.5);
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
.wrap{max-width:1080px;margin:0 auto;padding:2rem 1.25rem 4rem;}
.center-wrap{max-width:360px;margin:10vh auto;padding:0 1.25rem;}
h1{font-size:22px;font-weight:600;margin:0 0 4px;}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);margin:0 0 6px;font-weight:600;}
input,select,button,textarea{font-family:var(--font-sans);font-size:14px;color:var(--ink);}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
input,select,textarea{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper-raised);padding:9px 14px;font-weight:500;}
button:hover{background:var(--accent-soft);}
button.primary{background:var(--accent);color:#1A1815;border-color:var(--accent);width:100%;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:12px;color:var(--ink-soft);}
.panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:1.25rem;}
.panel h2{font-size:14px;margin:0 0 14px;font-weight:600;}
.hint{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.error-text{font-size:13px;color:var(--critical);margin-top:8px;min-height:1em;}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.type-tabs button{padding:6px 10px;font-size:12px;border-radius:999px;}
.type-tabs button.active{background:var(--accent);color:#1A1815;border-color:var(--accent);}
.preview-commission{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--accent-text);margin-bottom:12px;}
.preview-commission .row{display:flex;justify-content:space-between;}
.preview-commission .row+.row{margin-top:4px;}
.preview-commission .num{font-weight:600;}
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem;}
.stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.stat .label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;}
.stat .value{font-size:20px;font-weight:600;margin:0;}
.stat.total{background:var(--accent-soft);border-color:var(--accent);}
.stat.total .value{color:var(--accent-text);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 8px;font-weight:500;}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
td.num,th.num{text-align:right;}
.pill{font-size:11px;border-radius:999px;padding:3px 9px;font-weight:500;white-space:nowrap;display:inline-block;border:none;cursor:pointer;}
.pill.paid{background:var(--success-soft);color:var(--success);}
.pill.pending{background:var(--warning-soft);color:var(--warning);}
.table-scroll{overflow-x:auto;}
.roster-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.roster-chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;}
.roster-chip input[type="number"]{width:64px;padding:3px 6px;text-align:right;border-radius:4px;}
.roster-chip .del{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:2px 6px;line-height:1;border-radius:999px;}
.roster-chip .del:hover{color:var(--critical);background:var(--critical-soft);}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.add-row input{width:150px;}
.tabbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px;}
.userchip{font-size:13px;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:13px;padding:20px 10px;text-align:center;}
.op-item-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.op-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:500;font-size:13px;gap:12px;flex-wrap:wrap;}
.op-item-header label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:12px;color:var(--ink-soft);}
</style>
</head>
<body>

<div id="loginView" class="center-wrap">
  <p class="eyebrow">MJPRO Beauty</p>
  <h1>团队提成系统登录</h1>
  <div class="field">
    <label for="loginName">姓名</label>
    <select id="loginName"></select>
  </div>
  <div class="field">
    <label for="loginPin">PIN 码（6位数字）</label>
    <input type="password" id="loginPin" inputmode="numeric" maxlength="6" />
  </div>
  <button class="primary" id="loginBtn">登录</button>
  <p class="error-text" id="loginError"></p>
</div>

<div id="appView" class="wrap" style="display:none;">
  <div class="tabbar">
    <div>
      <p class="eyebrow">MJPRO Beauty</p>
      <h1 id="pageTitle">我的提成</h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="userchip" id="userChip"></span>
      <input type="month" id="monthPicker" />
      <button id="logoutBtn">登出</button>
    </div>
  </div>

  <div id="staffSection"></div>
  <div id="adminSection" style="display:none;"></div>
</div>

<script src="app.js"></script>
</body>
</html>
