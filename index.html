<script>
(function(){
  var saved = localStorage.getItem('mjpro-theme');
  if(saved==='dark' || saved==='light') document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#F5F4EF; --paper-raised:#FFFFFF; --ink:#1A1815; --ink-soft:#6B6357; --line:#DDD7C9;
  --accent:#96702E; --accent-soft:#F1E8D2; --accent-text:#6E5220;
  --success:#3F6B52; --success-soft:#E3EDE1; --warning:#9C7327; --warning-soft:#F1E6CE;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

  }
}
:root[data-theme="dark"]{

  --critical:#E27E7E; --critical-soft:#33201F; --shadow:rgba(0,0,0,0.5);
}

.center-wrap{max-width:360px;margin:10vh auto;padding:0 1.25rem;}
